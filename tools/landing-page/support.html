<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{APP_NAME}} — Support</title>
<style>
  :root { --surface:#F7F2EA; --text:#2C2520; --muted:#756A5E; --accent:#B4753A; }
  @media (prefers-color-scheme: dark){ :root { --surface:#1B1712; --text:#F0EBE3; --muted:#C4BCB2; --accent:#D4956A; } }
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;background:var(--surface);color:var(--text);line-height:1.6;margin:0}
  main{max-width:680px;margin:0 auto;padding:48px 24px}
  h1{letter-spacing:-0.02em} p{color:var(--muted);margin:12px 0} a{color:var(--accent)}
</style>
</head>
<body><main>
<h1>{{APP_NAME}} Support</h1>
<p>Questions, bugs, or ideas? Email <a href="mailto:{{SUPPORT_EMAIL}}">{{SUPPORT_EMAIL}}</a> — a human reads it, usually within a couple of days.</p>
<p>When reporting a bug, the app version (Settings → About inside the app) and your iOS version make fixes much faster.</p>
<p><a href="index.html">← Back</a></p>
</main></body></html>
