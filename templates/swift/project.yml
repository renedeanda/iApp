# XcodeGen spec for the Seed template.
#
# The wizard substitutes Seed → <AppName> + example.seed → example.<appname>
# throughout this file via bin/rename-template.sh at /new-app --commit time.
#
# Version + build come from Version.xcconfig — never bump them here.
# Pattern proven in shipped production apps.

name: Seed
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "26.0"
    macOS: "15.0"
  developmentLanguage: en
  defaultConfig: Debug
  generateEmptyDirectories: true
  groupSortPosition: top
  xcodeVersion: "16.0"

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.9"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_EMIT_LOC_STRINGS: true
    SWIFT_TREAT_WARNINGS_AS_ERRORS: true
    GCC_TREAT_WARNINGS_AS_ERRORS: true
    # Your Apple Developer team ID (placeholder — set your own). Team IDs
    # are not secrets; checking the real one in makes physical-device builds work.
    DEVELOPMENT_TEAM: YOURTEAMID
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: $(CURRENT_PROJECT_VERSION)
    MARKETING_VERSION: $(MARKETING_VERSION)
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    Release:
      SWIFT_COMPILATION_MODE: wholemodule
      VALIDATE_PRODUCT: YES

configFiles:
  Debug: Seed/Version.xcconfig
  Release: Seed/Version.xcconfig

# packages:
#   # TelemetryDeck is the only pre-approved analytics dep (per CLAUDE.md).
#   # Commented until wizard enables AnalyticsService — uncomment the
#   # `packages:` key along with the entry below.
#   TelemetryDeckSwiftSDK:
#     url: https://github.com/TelemetryDeck/SwiftSDK
#     exactVersion: "2.9.4"

targets:
  Seed:
    type: application
    platform: iOS
    sources:
      - path: Seed
        excludes:
          # _Disabled/ services don't compile until wizard graduates them.
          - "Services/_Disabled/**"
          # The full 24-pattern haptic catalog stays as reference; the
          # active 3 patterns live in Utilities/HapticPatterns.swift.
          - "Utilities/_HapticVocabulary/**"
          # The two unchosen typography specimens stay as reference.
          - "Theme/_TypographySpecimens/**"
          # App Intents ship as reference but stay off until the wizard
          # enables App Intents in DECISIONS/004 (then remove this line
          # + uncomment com.apple.developer.siri in Seed.entitlements).
          - "Intents/**"
    resources:
      - path: Seed/Resources
      # Pin the privacy manifest explicitly so it bundles regardless of
      # XcodeGen's default build-phase classification for .xcprivacy.
      # SeedTests/PrivacyManifestTests asserts this pin is present.
      - path: Seed/PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.seed
        INFOPLIST_FILE: Seed/Info.plist
        CODE_SIGN_ENTITLEMENTS: Seed/Seed.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        TARGETED_DEVICE_FAMILY: "1,2" # iPhone + iPad
        SUPPORTS_MACCATALYST: NO # wizard flips to YES if Universal Purchase
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    info:
      path: Seed/Info.plist
      properties:
        # Tie the generated Info.plist's version keys to Version.xcconfig
        # — otherwise XcodeGen defaults them to "1.0" / "1", which
        # mismatches any embedded extension's $(MARKETING_VERSION) once
        # the wizard enables a widget / Live Activity target.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.productivity
        UIRequiredDeviceCapabilities: [arm64]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        # iPad multitasking requires every orientation when TARGETED_DEVICE_FAMILY includes iPad.
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
        UIBackgroundModes: []
    scheme:
      testTargets:
        - SeedTests
      storeKitConfiguration: Seed/Seed.storekit
      gatherCoverageData: true
      commandLineArguments:
        "-com.apple.CoreData.ConcurrencyDebug 1": true

  SeedTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SeedTests
    dependencies:
      - target: Seed
    settings:
      base:
        BUNDLE_LOADER: $(TEST_HOST)
        GENERATE_INFOPLIST_FILE: YES
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Seed.app/Seed

# Widget extension target — commented out by default (taste rule 1:
# features off until the wizard enables them). The widget SOURCE FILES
# ship in templates/swift/SeedWidgets/ either way — what's gated is the
# build target. /new-app --commit uncomments this block (and adds the
# real bundle id) when DECISIONS/004-native-feature-checklist.md
# enables widgets. Pattern proven in a shipped production app.
#
# When enabling, also:
#   - host app already has the App Group in Seed/Seed.entitlements
#   - for Live Activities: add NSSupportsLiveActivities = YES to the
#     host Info.plist above, uncomment SeedLiveActivity() in
#     SeedWidgets/SeedWidgetBundle.swift, AND add SeedActivityAttributes.swift
#     to the Seed app target's sources (see Seed target's sources
#     block — uncomment the second list entry; the file ships in
#     SeedWidgets/ but must compile into BOTH targets because the
#     attributes type identity must match across the app↔widget IPC).
#   - SeedWidgets/ sits at the template root (sibling of Seed/ and of
#     this project.yml), hence the plain SeedWidgets paths below
#
#  SeedWidgets:
#    type: app-extension
#    platform: iOS
#    sources:
#      - path: SeedWidgets
#        excludes:
#          # SeedLiveActivity compiles only when Live Activities are on.
#          - "SeedLiveActivity.swift"
#    resources:
#      # The widget extension's OWN Localizable.xcstrings — widget-
#      # surface strings load from the extension bundle, not the app's.
#      # SeedTests/WidgetLocalizationParityTests expects this path.
#      - path: SeedWidgets/Resources/Localizable.xcstrings
#      # Each extension bundles its OWN privacy manifest (extensions load it
#      # from their bundle, not the host's). Pinned so it ships in the .appex.
#      - path: SeedWidgets/PrivacyInfo.xcprivacy
#    settings:
#      base:
#        PRODUCT_BUNDLE_IDENTIFIER: com.example.seed.widgets
#        INFOPLIST_FILE: SeedWidgets/Info.plist
#        CODE_SIGN_ENTITLEMENTS: SeedWidgets/SeedWidgets.entitlements
#        SKIP_INSTALL: NO
#  # ...and add to the Seed app target's dependencies + sources:
#  #   dependencies:
#  #     - target: SeedWidgets
#  #       embed: true
#  #   sources:
#  #     - path: Seed
#  #       excludes: [...existing excludes...]
#  #     - path: SeedWidgets/SeedActivityAttributes.swift  # ← cross-target type

schemes:
  Seed:
    build:
      targets:
        Seed: all
        SeedTests: [test]
    test:
      gatherCoverageData: true
      targets:
        - SeedTests
      configVariants:
        - Debug
